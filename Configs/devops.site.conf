<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/moldJS

    <Directory "/var/www/moldJS">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/moldJS.error.log
    CustomLog ${APACHE_LOG_DIR}/moldJS.access.log combined
</VirtualHost>